########################################################################
# Basic anchors                                                        #
########################################################################

.devtools_packages:
  packages: &devtools_packages
    - droidian-devtools
    - adaptation-hybris-devtools

.adaptation_generic_packages:
  packages: &adaptation_generic_packages
    - adaptation-android-generic

.fairphone_fp4_packages:
  packages: &fairphone_fp4_packages
    - adaptation-fairphone_fp4
    - adaptation-fp4-configs

########################################################################
# Recovery-flashable rootfses                                          #
########################################################################

rootfs:
  type: rootfs
  arch: [arm64]
  edition: phosh
  variant: phone
  apilevel: [30]

  packages: *adaptation_generic_packages

  bundles:
    # Developer tools bundle
    - name: droidian-devtools
      arch: any
      apilevel: any
      only_stable: yes
      packages: *devtools_packages

########################################################################
# Device specific images                                               #
########################################################################

#
# fairphone
#

# Fairphone FP4
fairphone_fp4:
  type: image
  arch: arm64
  edition: phosh
  variant: phone
  apilevel: 30

  packages: *fairphone_fp4_packages
