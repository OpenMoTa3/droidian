name: droidian rootfs-builder

on:
  workflow_dispatch:
  push:
    branches:
      - droidian
      - main
  schedule:
    - cron: "59 23 * * *"

permissions:
  contents: write
  actions: read

jobs:
  once:
    runs-on: ubuntu-latest
    name: Generate matrix
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate matrix
        id: gen-matrix
        run: |
          chmod +x ./generate_device_recipe.py
          JOBS="$(./generate_device_recipe.py --matrix)"
          echo "matrix=${JOBS}" >> $GITHUB_OUTPUT

  build-adaptation:
    runs-on: ubuntu-latest
    name: Build & Upload FP4 Adaptation Packages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Adaptation Debs
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          mkdir -p /tmp/debs
          
          echo "=== 1. 克隆 UT FP4 硬件仓库 ==="
          git clone --depth 1 https://gitlab.com/ubports/porting/reference-device-ports/android11/fairphone-4/fairphone-fp4.git /tmp/fp4-ut
          
          echo "=== 2. 构建 adaptation-fairphone-fp4 主包 ==="
          ADAPT_DIR="/tmp/adapt"
          rm -rf ${ADAPT_DIR}
          mkdir -p ${ADAPT_DIR}/DEBIAN
          
          cp -rv /tmp/fp4-ut/overlay/system/* ${ADAPT_DIR}/
          mkdir -p ${ADAPT_DIR}/etc/udev/rules.d
          if [ -d "${ADAPT_DIR}/lib/udev/rules.d" ]; then
            cp -rv ${ADAPT_DIR}/lib/udev/rules.d/* ${ADAPT_DIR}/etc/udev/rules.d/
          fi
          
          printf "Package: adaptation-fairphone-fp4\nVersion: 1.0.0\nSection: misc\nPriority: optional\nArchitecture: arm64\nMaintainer: OpenMoTa3 <noreply@github.com>\nDepends: udev, adaptation-fairphone-fp4-configs\nDescription: Device adaptation rules and drivers for Fairphone 4 on Droidian\n\n" > ${ADAPT_DIR}/DEBIAN/control
          dpkg-deb --build --root-owner-group ${ADAPT_DIR} /tmp/debs/adaptation-fairphone-fp4_1.0.0_arm64.deb

          echo "=== 3. 构建 adaptation-fairphone-fp4-configs 配置包 ==="
          CFG_DIR="/tmp/adapt-cfg"
          rm -rf ${CFG_DIR}
          mkdir -p ${CFG_DIR}/DEBIAN
          mkdir -p ${CFG_DIR}/var/lib/environment/phosh
          
          printf "PHOSH_MOBILE_SETTINGS_SCALE=2\n" > ${CFG_DIR}/var/lib/environment/phosh/fairphone-fp4.conf
          printf "Package: adaptation-fairphone-fp4-configs\nVersion: 1.0.0\nSection: misc\nPriority: optional\nArchitecture: arm64\nMaintainer: OpenMoTa3 <noreply@github.com>\nDescription: Device adaptation configs for Fairphone 4 on Droidian\n\n" > ${CFG_DIR}/DEBIAN/control
          dpkg-deb --build --root-owner-group ${CFG_DIR} /tmp/debs/adaptation-fairphone-fp4-configs_1.0.0_arm64.deb

      - name: Upload Adaptation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidian-fp4-adaptation-debs
          path: /tmp/debs/*.deb
          retention-days: 5

  build:
    runs-on: ubuntu-24.04-arm
    needs: [once, build-adaptation]

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.once.outputs.matrix) }}

    name: ${{ matrix.config.job_name }}

    steps:
      - name: Get current date
        run: echo "current_date=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Set suffix
        run: echo "release_suffix=_${{ env.current_date }}" >> $GITHUB_ENV

      - name: Set nightly version
        if: startsWith(github.ref, 'refs/tags/droidian') != true
        run: echo "DROIDIAN_VERSION=next" >> $GITHUB_ENV

      - name: Set version
        if: startsWith(github.ref, 'refs/tags/droidian') == true
        run: echo "DROIDIAN_VERSION=$(echo ${{ github.ref }} | rev | cut -d'/' -f1 | rev)" >> $GITHUB_ENV

      - name: Set identifier
        run: echo "DROIDIAN_IDENTIFIER=${{ matrix.config.product }}-${{ matrix.config.arch }}-${{ matrix.config.edition }}-${{ matrix.config.variant }}-${{ matrix.config.apilevel }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'
          submodules: 'recursive'

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Create build dir
        run: |
          mkdir -p /tmp/buildd-results
          mkdir -p out

      - name: Pull container
        run: docker pull quay.io/droidian/rootfs-builder:next-arm64

      - name: Start Container
        run: |
          CONTAINER_ID=$(docker run --detach --privileged --cgroupns=host \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            -v ${PWD}:/buildd/sources \
            --security-opt seccomp:unconfined \
            quay.io/droidian/rootfs-builder:next-arm64 sleep infinity)
          echo "CONTAINER_HASH=${CONTAINER_ID}" >> $GITHUB_ENV

      - name: Build rootfs
        run: |
          docker exec $CONTAINER_HASH /bin/sh -c '
            cd /buildd/sources
            
            # 1. 生成 Debos 官方 recipe
            DROIDIAN_VERSION="${{ env.DROIDIAN_VERSION }}" ./generate_device_recipe.py \
              ${{ matrix.config.product }} \
              ${{ matrix.config.arch }} \
              ${{ matrix.config.edition }} \
              ${{ matrix.config.variant }} \
              ${{ matrix.config.apilevel }} \
              ${{ matrix.config.droidian_variant }}
            
            # 2. 【核心修复】强制向 install-adaptation.sh 开头注入你的 GitHub Pages 源
            if [ -f "scripts/install-adaptation.sh" ]; then
              sed -i "2i echo \"deb [trusted=yes] https://openmota3.github.io/droidian-repo/ stable main\" > /etc/apt/sources.list.d/openmota3-pages.list\napt-get update" scripts/install-adaptation.sh
              echo "=== install-adaptation.sh 注入结果预览 ==="
              head -n 10 scripts/install-adaptation.sh
            fi

            # 3. 启动 debos 构建
            debos --disable-fakemachine generated/droidian.yaml
          '
          # 收集产物
          sudo chmod -R 777 /tmp/buildd-results/ || true
          cp -rv /tmp/buildd-results/* out/ 2>/dev/null || true
          sudo find . -maxdepth 2 -type f \( -name "*.tar*" -o -name "*.img*" -o -name "*.zip*" -o -name "*.xz" \) ! -path "./out/*" -exec cp -v {} out/ \; 2>/dev/null || true
          
          echo "=== 最终收集产物 ==="
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidian-out-${{ matrix.config.product }}-${{ matrix.config.arch }}-${{ matrix.config.edition }}-${{ matrix.config.variant }}-${{ matrix.config.apilevel }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

  prepare:
    runs-on: ubuntu-latest
    name: Create GitHub release
    needs: build
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url || steps.create_nightly.outputs.upload_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up some storage
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Nightly Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/droidian') != true
        run: |
          gh release delete nightly --yes || true
          git push --delete origin refs/tags/nightly || true
          gh release create nightly --title "Droidian Nightly Builds" --notes "Automated Nightly Images"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: droidian-out

      - name: Create SHA256SUMS
        run: |
          cd droidian-out
          for x in droidian-out-*; do
            if [ -d "$x" ]; then
              cd "$x"
              sha256sum * >> ../SHA256SUMS 2>/dev/null || true
              cd ..
            fi
          done

      - name: Create stable release (drafted)
        id: create_release
        if: startsWith(github.ref, 'refs/tags/droidian')
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/SHA256SUMS
          tag_name: ${{ github.ref }}
          draft: true
          prerelease: false

      - name: Create nightly release
        id: create_nightly
        if: startsWith(github.ref, 'refs/tags/droidian') != true
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/SHA256SUMS
          tag_name: nightly
          draft: false
          prerelease: true

  publish:
    runs-on: ubuntu-latest
    needs: [once, prepare]

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.once.outputs.matrix) }}

    name: Publish ${{ matrix.config.job_name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: droidian-out-${{ matrix.config.product }}-${{ matrix.config.arch }}-${{ matrix.config.edition }}-${{ matrix.config.variant }}-${{ matrix.config.apilevel }}
          path: droidian-out

      - name: Publish to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/droidian') && github.ref || 'nightly' }}
          draft: false
          prerelease: ${{ startsWith(github.ref, 'refs/tags/droidian') != true }}
