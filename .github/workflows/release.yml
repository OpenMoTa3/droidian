name: droidian rootfs-builder

on:
  workflow_dispatch:
  push:
    branches:
      - droidian
      - main
  schedule:
    - cron: "59 23 * * *"

permissions:
  contents: write
  actions: read

jobs:
  once:
    runs-on: ubuntu-latest
    name: Generate matrix
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate matrix
        id: gen-matrix
        run: |
          chmod +x ./generate_device_recipe.py
          JOBS="$(./generate_device_recipe.py --matrix)"
          echo "matrix=${JOBS}" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-24.04-arm
    needs: once

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.once.outputs.matrix) }}

    name: ${{ matrix.config.job_name }}

    steps:
      - name: Get current date
        run: echo "current_date=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Set suffix
        run: echo "release_suffix=_${{ env.current_date }}" >> $GITHUB_ENV

      - name: Set nightly version
        if: startsWith(github.ref, 'refs/tags/droidian') != true
        run: echo "DROIDIAN_VERSION=next" >> $GITHUB_ENV

      - name: Set version
        if: startsWith(github.ref, 'refs/tags/droidian') == true
        run: echo "DROIDIAN_VERSION=$(echo ${{ github.ref }} | rev | cut -d'/' -f1 | rev)" >> $GITHUB_ENV

      - name: Set identifier
        run: echo "DROIDIAN_IDENTIFIER=${{ matrix.config.product }}-${{ matrix.config.arch }}-${{ matrix.config.edition }}-${{ matrix.config.variant }}-${{ matrix.config.apilevel }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'
          submodules: 'recursive'

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Fetch and build packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apt
          gh run download --repo OpenMoTa3/kernel-fairphone-sm7225 --name droidian-fp4-kernel-deb --dir apt/ 2>/dev/null || true
          
          TARGET_PRODUCT=$(echo "${{ matrix.config.product }}" | tr '[:upper:]' '[:lower:]')
          if echo "$TARGET_PRODUCT" | grep -q "fp4"; then
            echo ">>> 命中 Fairphone 4 (${{ matrix.config.product }})，开始拉取并编译适配包 <<<"
            git clone --depth 1 https://gitlab.com/ubports/porting/reference-device-ports/android11/fairphone-4/fairphone-fp4.git /tmp/fp4-ut
            
            # 1. 构建主包
            mkdir -p /tmp/adapt/DEBIAN /tmp/adapt/etc/udev/rules.d
            [ -d /tmp/fp4-ut/overlay/system/etc/udev/rules.d ] && cp -r /tmp/fp4-ut/overlay/system/etc/udev/rules.d/* /tmp/adapt/etc/udev/rules.d/
            printf "Package: adaptation-fairphone-fp4\nVersion: 1.0.0\nSection: misc\nPriority: optional\nArchitecture: arm64\nMaintainer: OpenMoTa3 <noreply@github.com>\nDepends: udev\nDescription: FP4 Adaptation\n" > /tmp/adapt/DEBIAN/control
            dpkg-deb --build --root-owner-group /tmp/adapt apt/adaptation-fairphone-fp4_1.0.0_arm64.deb
            
            # 2. 构建配置包
            mkdir -p /tmp/adapt-cfg/DEBIAN
            printf "Package: adaptation-fairphone-fp4-configs\nVersion: 1.0.0\nSection: misc\nPriority: optional\nArchitecture: arm64\nMaintainer: OpenMoTa3 <noreply@github.com>\nDescription: FP4 Adaptation Configs\n" > /tmp/adapt-cfg/DEBIAN/control
            dpkg-deb --build --root-owner-group /tmp/adapt-cfg apt/adaptation-fairphone-fp4-configs_1.0.0_arm64.deb
          fi
          
          echo "=== 最终待注入的本地 Deb 清单 ==="
          ls -la apt/

      - name: Create build dir
        run: |
          mkdir -p /tmp/buildd-results
          mkdir -p out

      - name: Pull container
        run: docker pull quay.io/droidian/rootfs-builder:next-arm64

      - name: Start Container
        run: |
          CONTAINER_ID=$(docker run --detach --privileged --cgroupns=host \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            -v ${PWD}:/buildd/sources \
            --security-opt seccomp:unconfined \
            quay.io/droidian/rootfs-builder:next-arm64 sleep infinity)
          echo "CONTAINER_HASH=${CONTAINER_ID}" >> $GITHUB_ENV

      - name: Build rootfs
        run: |
          docker exec $CONTAINER_HASH /bin/sh -c '
            cd /buildd/sources
            
            # 1. 生成基础 recipe
            DROIDIAN_VERSION="${{ env.DROIDIAN_VERSION }}" ./generate_device_recipe.py \
              ${{ matrix.config.product }} \
              ${{ matrix.config.arch }} \
              ${{ matrix.config.edition }} \
              ${{ matrix.config.variant }} \
              ${{ matrix.config.apilevel }} \
              ${{ matrix.config.droidian_variant }}
            
            # 2. 重写 install-adaptation.sh，优先直接从本地 /tmp/local_debs 执行 dpkg -i
            mkdir -p scripts
            cat << "EOF_SCRIPT" > scripts/install-adaptation.sh
          #!/bin/sh
          set -e
          echo "=== [Hooks] 正在执行设备适配包安装 ==="
          if [ -d /tmp/local_debs ] && [ -n "$(ls -A /tmp/local_debs/*.deb 2>/dev/null)" ]; then
              echo ">>> 发现本地注入的 Deb 包，直接执行本地安装 <<<"
              dpkg -i --force-all /tmp/local_debs/*.deb || true
              apt-get update || true
              DEBIAN_FRONTEND=noninteractive apt-get -y -f --allow-unauthenticated install || true
              dpkg -i --force-all /tmp/local_debs/*.deb || true
              rm -rf /tmp/local_debs
          else
              echo ">>> 未检测到本地包，尝试网络安装: $@ <<<"
              apt-get update || true
              DEBIAN_FRONTEND=noninteractive apt-get -y install "$@" || true
          fi
          exit 0
          EOF_SCRIPT
            chmod +x scripts/install-adaptation.sh

            # 3. 用 Python 精确修改 generated/droidian.yaml，将 apt 目录 overlay 进 target
            python3 - << "EOF_PY"
          import yaml

          recipe_path = "generated/droidian.yaml"
          with open(recipe_path, "r") as f:
              data = yaml.safe_load(f)

          new_actions = []
          injected = False

          for act in data:
              # 在执行 install-adaptation 脚本前，先将本地 apt/ 灌入 target 的 /tmp/local_debs
              if not injected and ("install-adaptation" in str(act.get("script", "")) or "install-adaptation" in str(act.get("command", ""))):
                  new_actions.append({
                      "action": "overlay",
                      "description": "Inject local deb packages into target rootfs",
                      "source": "apt",
                      "destination": "/tmp/local_debs"
                  })
                  injected = True
              new_actions.append(act)

          # 如果上面没匹配到，直接在第一个 action 之后插入
          if not injected and len(new_actions) > 1:
              new_actions.insert(1, {
                  "action": "overlay",
                  "description": "Inject local deb packages into target rootfs",
                  "source": "apt",
                  "destination": "/tmp/local_debs"
              })

          with open(recipe_path, "w") as f:
              yaml.dump(new_actions, f, sort_keys=False)
          print(">>> generated/droidian.yaml 本地包注入配置完成 <<<")
          EOF_PY

            # 4. 执行 debos 构建
            debos --disable-fakemachine generated/droidian.yaml
          '
          cp -r /tmp/buildd-results/* out/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidian-out-${{ matrix.config.product }}-${{ matrix.config.arch }}-${{ matrix.config.edition }}-${{ matrix.config.variant }}-${{ matrix.config.apilevel }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

  prepare:
    runs-on: ubuntu-latest
    name: Create GitHub release
    needs: build
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url || steps.create_nightly.outputs.upload_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up some storage
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Nightly Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/droidian') != true
        run: |
          gh release delete nightly --yes || true
          git push --delete origin refs/tags/nightly || true
          gh release create nightly --title "Droidian Nightly Builds" --notes "Automated Nightly Images"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: droidian-out

      - name: Create SHA256SUMS
        run: |
          cd droidian-out
          for x in droidian-out-*; do
            if [ -d "$x" ]; then
              cd "$x"
              sha256sum * >> ../SHA256SUMS 2>/dev/null || true
              cd ..
            fi
          done

      - name: Create stable release (drafted)
        id: create_release
        if: startsWith(github.ref, 'refs/tags/droidian')
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/SHA256SUMS
          tag_name: ${{ github.ref }}
          draft: true
          prerelease: false

      - name: Create nightly release
        id: create_nightly
        if: startsWith(github.ref, 'refs/tags/droidian') != true
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/SHA256SUMS
          tag_name: nightly
          draft: false
          prerelease: true

  publish:
    runs-on: ubuntu-latest
    needs: [once, prepare]

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.once.outputs.matrix) }}

    name: Publish ${{ matrix.config.job_name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: droidian-out-${{ matrix.config.product }}-${{ matrix.config.arch }}-${{ matrix.config.edition }}-${{ matrix.config.variant }}-${{ matrix.config.apilevel }}
          path: droidian-out

      - name: Publish to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/droidian') && github.ref || 'nightly' }}
          draft: false
          prerelease: ${{ startsWith(github.ref, 'refs/tags/droidian') != true }}
